<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const CONFIG = {

  SUPABASE_URL:
    'https://yzmxsulamzoxxfzzztgt.supabase.co',

  SUPABASE_ANON_KEY:
    'sb_publishable_uwrr5J2EdLC6i8GYIQqLww_NN5kaTSg'

};


/* =========================================================
   SUPABASE CLIENT
========================================================= */

const sb =
  window.supabase.createClient(
    CONFIG.SUPABASE_URL,
    CONFIG.SUPABASE_ANON_KEY
  );


/* =========================================================
   CONSTANTS
========================================================= */

const SH = [
  'Morning',
  'Evening',
  'Night',
  'OFF'
];

const D = [
  'Sunday',
  'Monday',
  'Tuesday',
  'Wednesday',
  'Thursday',
  'Friday',
  'Saturday'
];


/* =========================================================
   STATE
========================================================= */

let employees = [];

let session =
  JSON.parse(
    localStorage.getItem('sr_session') || 'null'
  );

let realtimeChannel = null;

let realtimeRetryTimer = null;


/* =========================================================
   DOM
========================================================= */

const loginDiv =
  document.getElementById('login');

const app =
  document.getElementById('app');

const loginForm =
  document.getElementById('loginForm');

const loginBtn =
  document.getElementById('loginBtn');

const u =
  document.getElementById('u');

const p =
  document.getElementById('p');

const err =
  document.getElementById('err');

const who =
  document.getElementById('who');

const role =
  document.getElementById('role');

const add =
  document.getElementById('add');

const usersBtn =
  document.getElementById('users');

const reset =
  document.getElementById('reset');

const logoutBtn =
  document.getElementById('logoutBtn');

const printBtn =
  document.getElementById('printBtn');

const tbody =
  document.getElementById('tbody');

const search =
  document.getElementById('search');

const status =
  document.getElementById('status');

const modal =
  document.getElementById('modal');

const userlist =
  document.getElementById('userlist');

const nu =
  document.getElementById('nu');

const np =
  document.getElementById('np');

const newRole =
  document.getElementById('newRole');

const uerr =
  document.getElementById('uerr');

const cp =
  document.getElementById('cp');

const ap =
  document.getElementById('ap');

const ap2 =
  document.getElementById('ap2');

const perr =
  document.getElementById('perr');

const createUserBtn =
  document.getElementById('createUserBtn');

const closeUsersBtn =
  document.getElementById('closeUsersBtn');

const changePasswordBtn =
  document.getElementById('changePasswordBtn');


/* =========================================================
   RPC
========================================================= */

async function rpc(name, body = {}){

  const { data, error } =
    await sb.rpc(name, body);

  if(error){

    throw new Error(
      error.message ||
      'Supabase request failed'
    );

  }

  return data;

}


/* =========================================================
   ERROR MESSAGE
========================================================= */

function niceError(ex){

  if(!ex){
    return 'Request failed';
  }

  if(typeof ex === 'string'){
    return ex;
  }

  return (
    ex.message ||
    ex.error_description ||
    'Request failed'
  );

}


/* =========================================================
   SESSION VALIDATION
========================================================= */

async function validateSession(){

  if(!session?.token){

    return false;

  }

  try{

    const rows =
      await rpc(
        'get_current_user',
        {
          p_token:session.token
        }
      );

    if(
      !rows ||
      !rows.length
    ){

      clearSession();

      return false;

    }

    /*
      Refresh role/username from database.
      This prevents an old localStorage role
      from causing permission problems.
    */

    session.username =
      rows[0].username;

    session.role =
      rows[0].role;

    session.user_id =
      rows[0].user_id;

    localStorage.setItem(
      'sr_session',
      JSON.stringify(session)
    );

    return true;

  }catch(ex){

    console.error(
      'Session validation failed:',
      ex
    );

    return false;

  }

}


/* =========================================================
   CLEAR SESSION
========================================================= */

function clearSession(){

  localStorage.removeItem(
    'sr_session'
  );

  session = null;

}


/* =========================================================
   LOGIN
========================================================= */

async function login(e){

  e.preventDefault();

  err.textContent = '';

  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';

  try{

    const rows =
      await rpc(
        'login_user',
        {
          p_username:
            u.value.trim(),

          p_password:
            p.value
        }
      );

    if(
      !rows ||
      !rows.length
    ){

      throw new Error(
        'Invalid username or password'
      );

    }

    session = {

      token:
        rows[0].token,

      user_id:
        rows[0].user_id,

      username:
        rows[0].username,

      role:
        rows[0].role

    };

    localStorage.setItem(
      'sr_session',
      JSON.stringify(session)
    );

    p.value = '';

    await show();

  }catch(ex){

    console.error(ex);

    err.textContent =
      niceError(ex);

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';

  }

}


/* =========================================================
   SHOW APP
========================================================= */

async function show(){

  if(!session?.token){

    clearSession();

    return;

  }

  const valid =
    await validateSession();

  if(!valid){

    return;

  }

  loginDiv.classList.add('hidden');

  app.classList.remove('hidden');

  who.textContent =
    session.username;

  role.textContent =
    session.role === 'admin'
      ? 'Admin'
      : 'Viewer';

  const isAdmin =
    session.role === 'admin';

  add.classList.toggle(
    'hidden',
    !isAdmin
  );

  usersBtn.classList.toggle(
    'hidden',
    !isAdmin
  );

  reset.classList.toggle(
    'hidden',
    !isAdmin
  );

  await loadRoster();

  setupRealtime();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  try{

    if(session?.token){

      await rpc(
        'logout_user',
        {
          p_token:
            session.token
        }
      );

    }

  }catch(ex){

    console.warn(
      'Logout RPC failed:',
      ex
    );

  }

  stopRealtime();

  clearSession();

  employees = [];

  tbody.innerHTML = '';

  app.classList.add('hidden');

  loginDiv.classList.remove('hidden');

  u.value = '';
  p.value = '';

  err.textContent = '';

}


/* =========================================================
   LOAD ROSTER
========================================================= */

async function loadRoster(){

  if(!session?.token){
    return;
  }

  try{

    status.innerHTML =
      '<span class="live-dot"></span>' +
      'Loading roster...';

    /*
      Use get_roster RPC instead of direct table reads.
    */

    const rows =
      await rpc(
        'get_roster',
        {
          p_token:
            session.token
        }
      );

    if(!rows){

      employees = [];

      render();

      return;

    }

    const map = {};

    rows.forEach(x => {

      if(!map[x.employee_id]){

        map[x.employee_id] = {

          id:
            x.employee_id,

          name:
            x.employee_name,

          shifts:
            Array(7).fill('OFF')

        };

      }

      map[x.employee_id]
        .shifts[x.day_of_week] =
          x.shift_name || 'OFF';

    });

    employees =
      Object.values(map);

    render();

    status.innerHTML =
      '<span class="live-dot"></span>' +
      'Live • Updated ' +
      new Date().toLocaleTimeString();

  }catch(ex){

    console.error(
      'Roster load error:',
      ex
    );

    const message =
      niceError(ex);

    /*
      Invalid/expired token.
    */

    if(
      message.toLowerCase()
        .includes('invalid or expired')
    ){

      alert(
        'Your session has expired. Please login again.'
      );

      await logout();

      return;

    }

    status.innerHTML =
      '<span class="live-dot offline"></span>' +
      'Connection error: ' +
      message;

  }

}


/* =========================================================
   REALTIME
========================================================= */

function stopRealtime(){

  if(realtimeRetryTimer){

    clearTimeout(
      realtimeRetryTimer
    );

    realtimeRetryTimer = null;

  }

  if(realtimeChannel){

    sb.removeChannel(
      realtimeChannel
    );

    realtimeChannel = null;

  }

}


function setupRealtime(){

  stopRealtime();

  if(!session){

    return;

  }

  realtimeChannel =
    sb
      .channel('shift-roster-live')

      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'employees'
        },
        payload => {

          console.log(
            'Employee realtime change:',
            payload
          );

          loadRoster();

        }
      )

      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'shifts'
        },
        payload => {

          console.log(
            'Shift realtime change:',
            payload
          );

          loadRoster();

        }
      )

      .subscribe(
        state => {

          console.log(
            'Realtime:',
            state
          );

          if(
            state === 'SUBSCRIBED'
          ){

            status.innerHTML =
              '<span class="live-dot"></span>' +
              'Live • Realtime connected';

          }

          if(
            state === 'CHANNEL_ERROR' ||
            state === 'TIMED_OUT' ||
            state === 'CLOSED'
          ){

            status.innerHTML =
              '<span class="live-dot offline"></span>' +
              'Realtime disconnected';

            if(session){

              if(realtimeRetryTimer){

                clearTimeout(
                  realtimeRetryTimer
                );

              }

              realtimeRetryTimer =
                setTimeout(
                  () => {

                    if(session){

                      setupRealtime();

                    }

                  },
                  5000
                );

            }

          }

        }
      );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  tbody.innerHTML = '';

  const q =
    search.value
      .toLowerCase()
      .trim();

  const isAdmin =
    session &&
    session.role === 'admin';

  const filtered =
    employees.filter(e => {

      return !q ||
        e.name
          .toLowerCase()
          .includes(q);

    });

  if(!filtered.length){

    const tr =
      document.createElement('tr');

    const td =
      document.createElement('td');

    td.colSpan = 9;

    td.className = 'loading';

    td.textContent =
      q
        ? 'No employee found'
        : 'No employees';

    tr.appendChild(td);

    tbody.appendChild(tr);

    return;

  }


  filtered.forEach(e => {

    const tr =
      document.createElement('tr');


    /* Employee name */

    const n =
      document.createElement('td');

    n.className =
      'employee';

    n.textContent =
      e.name;

    tr.appendChild(n);


    /* Seven days */

    e.shifts.forEach(
      (s,d) => {

        const td =
          document.createElement('td');

        const sel =
          document.createElement('select');

        sel.className =
          'sel ' + s;

        SH.forEach(v => {

          const o =
            document.createElement('option');

          o.value = v;

          o.textContent = v;

          o.selected =
            v === s;

          sel.appendChild(o);

        });


        if(isAdmin){

          sel.disabled = false;

          sel.onchange =
            async () => {

              const oldValue =
                s;

              const newValue =
                sel.value;

              try{

                sel.disabled = true;

                await rpc(
                  'set_shift',
                  {
                    p_token:
                      session.token,

                    p_employee_id:
                      e.id,

                    p_day_of_week:
                      d,

                    p_shift_name:
                      newValue
                  }
                );

                /*
                  Update local value immediately.
                */

                e.shifts[d] =
                  newValue;

                sel.className =
                  'sel ' + newValue;

                status.innerHTML =
                  '<span class="live-dot"></span>' +
                  'Saved • ' +
                  e.name +
                  ' / ' +
                  D[d] +
                  ' / ' +
                  newValue;

              }catch(ex){

                console.error(ex);

                alert(
                  niceError(ex)
                );

                e.shifts[d] =
                  oldValue;

                await loadRoster();

              }finally{

                sel.disabled = false;

              }

            };

        }else{

          sel.disabled = true;

        }


        td.appendChild(sel);

        tr.appendChild(td);

      }
    );


    /* Manage/Delete */

    const m =
      document.createElement('td');

    m.className =
      'manage';

    if(isAdmin){

      const b =
        document.createElement('button');

      b.className =
        'del';

      b.type =
        'button';

      b.textContent =
        'Delete';

      b.onclick =
        () => deleteEmployee(e);

      m.appendChild(b);

    }

    tr.appendChild(m);

    tbody.appendChild(tr);

  });

}


/* =========================================================
   ADD EMPLOYEE
========================================================= */

async function addEmployee(){

  if(
    !session ||
    session.role !== 'admin'
  ){

    alert(
      'Admin access required'
    );

    return;

  }

  const n =
    prompt(
      'Employee name:'
    );

  if(
    !n ||
    !n.trim()
  ){

    return;

  }

  try{

    await rpc(
      'add_employee',
      {
        p_token:
          session.token,

        p_name:
          n.trim()
      }
    );

    await loadRoster();

  }catch(ex){

    alert(
      niceError(ex)
    );

  }

}

   DELETE EMPLOYEE

async function deleteEmployee(e){

  if(
    !confirm(

/* =========================================================
   OPEN USERS
========================================================= */

async function openUsers(){

  /*
    Always verify the role from database first.
    This prevents stale localStorage data.
  */

  try{

    const valid =
      await validateSession();

    if(!valid){

      alert(
        'Your session has expired. Please login again.'
      );

      return;

    }

    if(
      session.role !== 'admin'
    ){

      alert(
        'Admin access required'
      );

      return;

    }

    uerr.textContent = '';

    perr.textContent = '';

    await renderUsers();

    modal.classList.remove(
      'hidden'
    );

  }catch(ex){

    console.error(ex);

    alert(
      niceError(ex)
    );

  }

}


/* =========================================================
   CLOSE USERS
========================================================= */

function closeUsers(){

  modal.classList.add(
    'hidden'
  );

}


/* =========================================================
   RENDER USERS
========================================================= */

async function renderUsers(){

  userlist.innerHTML =
    '<div class="loading">Loading users...</div>';

  const rows =
    await rpc(
      'list_users',
      {
        p_token:
          session.token
      }
    );

  userlist.innerHTML = '';


  if(
    !rows ||
    !rows.length
  ){

    userlist.innerHTML =
      '<div class="loading">No users found</div>';

    return;

  }


  rows.forEach(x => {

    const r =
      document.createElement('div');

    r.className =
      'userrow';


    const span =
      document.createElement('span');

    span.textContent =
      x.username +
      ' (' +
      (
        x.role === 'admin'
          ? 'Administrator'
          : 'Viewer'
      ) +
      ')';

    r.appendChild(span);


    /*
      Do not show delete button for yourself.
    */

    if(
      x.username !==
      session.username
    ){

      const b =
        document.createElement('button');

      b.type =
        'button';

      b.textContent =
        'Delete';


      b.onclick =
        async () => {

          if(
            !confirm(
              'Delete ' +
              x.username +
              '?'
            )
          ){

            return;

          }


          try{

            b.disabled = true;

            await rpc(
              'delete_user',
              {
                p_token:
                  session.token,

                /*
                  IMPORTANT:
                  SQL expects p_user_id,
                  NOT p_username.
                */

                p_user_id:
                  x.id
              }
            );

            await renderUsers();

          }catch(ex){

            alert(
              niceError(ex)
            );

            b.disabled = false;

          }

        };


      r.appendChild(b);

    }


    userlist.appendChild(r);

  });

}


/* =========================================================
   CREATE USER
========================================================= */

async function createUser(){

  const n =
    nu.value.trim();

  const pw =
    np.value;

  const r =
    newRole.value;

  uerr.textContent = '';


  if(
    !n ||
    !pw
  ){

    uerr.textContent =
      'Username and password are required';

    return;

  }


  if(
    pw.length < 4
  ){

    uerr.textContent =
      'Password must be at least 4 characters';

    return;

  }


  try{

    createUserBtn.disabled = true;

    await rpc(
      'create_user',
      {
        p_token:
          session.token,

        p_username:
          n,

        p_password:
          pw,

        p_role:
          r
      }
    );


    nu.value = '';

    np.value = '';

    newRole.value =
      'viewer';


    await renderUsers();


    uerr.textContent =
      '';

    alert(
      'User created successfully'
    );

  }catch(ex){

    console.error(ex);

    uerr.textContent =
      niceError(ex);

  }finally{

    createUserBtn.disabled = false;

  }

}


/* =========================================================
   CHANGE PASSWORD
========================================================= */

async function changeMyPassword(){

  const current =
    cp.value;

  const newp =
    ap.value;

  const confirmP =
    ap2.value;

  perr.textContent = '';


  if(
    !current ||
    !newp ||
    !confirmP
  ){

    perr.textContent =
      'Please fill all password fields';

    return;

  }


  if(
    newp.length < 4
  ){

    perr.textContent =
      'New password must be at least 4 characters';

    return;

  }


  if(
    newp !== confirmP
  ){

    perr.textContent =
      'New passwords do not match';

    return;

  }


  try{

    changePasswordBtn.disabled = true;

    /*
      IMPORTANT:
      SQL expects p_old_password.
    */

    await rpc(
      'change_my_password',
      {
        p_token:
          session.token,

        p_old_password:
          current,

        p_new_password:
          newp
      }
    );


    cp.value = '';

    ap.value = '';

    ap2.value = '';

    perr.textContent =
      '';

    alert(
      'Password changed successfully'
    );

  }catch(ex){

    console.error(ex);

    perr.textContent =
      niceError(ex);

  }finally{

    changePasswordBtn.disabled = false;

  }

}
